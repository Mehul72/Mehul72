<!doctype html>
<meta charset="utf-8">
<title>README preview</title>
<style>
  :root { --bg: #0d1117; --fg: #e6edf3; --border: #30363d; }
  body.light { --bg: #ffffff; --fg: #1f2328; --border: #d0d7de; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  .box { width: 896px; margin: 24px auto; border: 1px solid var(--border); border-radius: 6px; }
  .box-head { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .markdown-body { padding: 24px; }
  .markdown-body p { margin: 0 0 16px; }
  .markdown-body img, .markdown-body object { max-width: 100%; box-sizing: content-box; background-color: var(--bg); vertical-align: middle; border-style: none; }
  .markdown-body a { color: #4493f8; }
</style>
<body>
<div class="box">
  <div class="box-head">Mehul72 / README.md</div>
  <article class="markdown-body" id="readme"></article>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const theme = params.get("theme") || "dark";
  const t = params.has("t") ? Number(params.get("t")) : null;
  if (theme === "light") document.body.classList.add("light");
  const freeze = img => {
    const obj = document.createElement("object");
    obj.type = "image/svg+xml";
    obj.data = img.src;
    obj.setAttribute("role", "img");
    if (img.alt) obj.setAttribute("aria-label", img.alt);
    for (const a of ["width", "height"]) if (img.hasAttribute(a)) obj.setAttribute(a, img.getAttribute(a));
    obj.style.verticalAlign = "middle";
    obj.addEventListener("load", () => {
      const doc = obj.contentDocument, svg = doc.documentElement;
      svg.pauseAnimations(); svg.setCurrentTime(t);
      for (const anim of doc.getAnimations()) { anim.pause(); anim.currentTime = t * 1000; }
    });
    img.replaceWith(obj);
  };
  fetch("/README.md?v=" + Date.now()).then(r => r.text()).then(src => {
    const root = document.getElementById("readme");
    root.innerHTML = src.replaceAll("https://raw.githubusercontent.com/Mehul72/Mehul72/main/", "/");
    for (const picture of root.querySelectorAll("picture")) {
      const img = picture.querySelector("img");
      const dark = picture.querySelector('source[media*="dark"]');
      if (theme === "dark" && dark) img.src = dark.getAttribute("srcset") + "?v=" + Date.now();
      else img.src = img.getAttribute("src") + "?v=" + Date.now();
      picture.querySelectorAll("source").forEach(s => s.remove());
      if (t !== null) freeze(img);
    }
  });
</script>
